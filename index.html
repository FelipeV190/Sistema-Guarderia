<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de gestión para guarderías · Proyecto FIS</title>
  <meta name="description" content="Sistema de gestión para guarderías: matrículas, grupos etarios, pagos, personal y portal del acudiente. Proyecto de Fundamentos de Ingeniería de Software.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <header class="app-header" id="app-header" hidden></header>

  <!-- Infraestructura -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/seed.js"></script>

  <script src="assets/js/views-ninos.js"></script>
  <script src="assets/js/views-matriculas.js"></script>

  <script src="assets/js/views-pagos.js"></script>
  <script src="assets/js/views-portal.js"></script>
